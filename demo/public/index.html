<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripSage 差旅出行助手</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
</head>
<body>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <div class="app-container">
        <!-- 侧边栏 -->
        <aside class="sidebar collapsed" id="sidebar">
            <div class="sidebar-brand">
                <div class="brand-icon">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="10" r="3"/><path d="M12 2a8 8 0 0 0-8 8c0 5.4 8 12 8 12s8-6.6 8-12a8 8 0 0 0-8-8z"/>
                    </svg>
                </div>
                <div class="brand-text">
                    <span class="brand-name">TripSage</span>
                    <span class="brand-subtitle">差旅出行助手</span>
                </div>
                <button class="sidebar-toggle" id="sidebar-toggle" title="收起侧边栏">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
                </button>
            </div>

            <div class="sidebar-sections">
                <section class="sidebar-card" id="user-card">
                    <div class="card-header">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        <h3>本机数据</h3>
                    </div>
                    <div class="card-body">
                        <p class="local-data-note">无需登录。偏好与会话历史仅保存在当前浏览器，可随时清除。</p>
                    </div>
                </section>

                <section class="sidebar-card">
                    <div class="card-header">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        <h3>偏好设置</h3>
                    </div>
                    <div id="sidebar-preferences" class="card-body">
                        <p class="empty-state">加载中...</p>
                    </div>
                    <button type="button" class="sidebar-action" id="edit-preferences-btn">编辑本机偏好</button>
                </section>

                <section class="sidebar-card">
                    <div class="card-header">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                        <h3>会话与行程</h3>
                    </div>
                    <div id="sidebar-history" class="card-body">
                        <p class="empty-state">加载中...</p>
                    </div>
                    <button type="button" class="sidebar-action subtle" id="clear-history-btn">清除会话历史</button>
                </section>

                <section class="sidebar-card">
                    <div class="card-header">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                        <h3>服务状态</h3>
                    </div>
                    <div id="sidebar-status" class="card-body">
                        <p class="empty-state">加载中...</p>
                    </div>
                    <a class="sidebar-manage-link" href="/knowledge.html" target="_blank" rel="noopener">管理差旅知识库</a>
                </section>
            </div>

            <div class="sidebar-footer">本机保存 · 不上传账号资料</div>
        </aside>

        <!-- 主聊天区 -->
        <main class="chat-main">
            <header class="chat-header">
                <button class="sidebar-toggle" id="sidebar-toggle-mobile" title="菜单" style="display:none">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                </button>
                <div class="header-info">
                    <span class="header-title">TripSage</span>
                    <span class="header-indicator" id="connection-status" title="系统状态">
                        <span class="indicator-dot"></span>
                        <span class="indicator-text">在线</span>
                    </span>
                </div>
                <button class="header-btn" id="new-chat-btn" title="开始新对话">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                    <span>新对话</span>
                </button>
            </header>

            <div id="messages" class="messages-container">
                <div class="welcome-screen">
                    <div class="welcome-icon" aria-hidden="true">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 19h16M6 16l4-9 4 6 4-8"/><circle cx="10" cy="7" r="1.5"/><circle cx="14" cy="13" r="1.5"/><circle cx="18" cy="5" r="1.5"/>
                        </svg>
                    </div>
                    <h2 class="welcome-title">下一次出差，从哪里出发？</h2>
                    <p class="welcome-desc">告诉我城市、日期和偏好，我来整理路线、住宿与出行提醒。</p>
                    <p class="demo-notice">轻量体验版</p>
                    <div class="welcome-cards">
                        <button type="button" class="welcome-card" data-example="帮我规划从上海到北京三天的出差行程，包括交通、住宿区域和每日安排。">
                            <div class="wc-icon">
                                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="10" r="3"/><path d="M12 2a8 8 0 0 0-8 8c0 5.4 8 12 8 12s8-6.6 8-12a8 8 0 0 0-8-8z"/></svg>
                            </div>
                            <div class="wc-text">
                                <strong>规划完整行程</strong>
                                <span>交通、住宿区域与每日安排</span>
                            </div>
                        </button>
                        <button type="button" class="welcome-card" data-example="查询北京未来三天的天气、出行提醒和机酒高铁预订入口。">
                            <div class="wc-icon">
                                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.5 19H9a7 7 0 1 1 6.7-9H17.5a4.5 4.5 0 1 1 0 9Z"/><path d="M12 2v2M4.2 6.2l1.4 1.4"/></svg>
                            </div>
                            <div class="wc-text">
                                <strong>查询实时信息</strong>
                                <span>天气、出行提醒与预订入口</span>
                            </div>
                        </button>
                        <button type="button" class="welcome-card" data-example="查询公司差旅政策中的交通、住宿、报销和预订规则。">
                            <div class="wc-icon">
                                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 17h16M6 13h12l-2-7H8l-2 7Z"/><circle cx="8" cy="19" r="1"/><circle cx="16" cy="19" r="1"/></svg>
                            </div>
                            <div class="wc-text">
                                <strong>查询差旅政策</strong>
                                <span>报销标准、预订规则与企业制度</span>
                            </div>
                        </button>
                    </div>
                    <p class="welcome-hint">也可以直接在下方描述你的需求</p>
                </div>
            </div>

            <div class="input-area">
                <div class="input-wrapper">
                    <textarea id="message-input"
                              placeholder="输入您的问题，例如：规划从上海到北京出差3天的行程"
                              rows="1"
                              autofocus></textarea>
                    <button id="send-btn" title="发送 (Enter)">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"/>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                        </svg>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <dialog class="preferences-dialog" id="preferences-dialog">
        <form method="dialog" id="preferences-form">
            <div class="dialog-header">
                <div><h2>本机差旅偏好</h2><p>仅用于当前浏览器中的后续规划。</p></div>
                <button type="button" class="dialog-close" id="close-preferences-btn" aria-label="关闭">×</button>
            </div>
            <div class="preference-form-grid">
                <label>常驻城市<input name="home_location" maxlength="30" placeholder="例如：上海"></label>
                <label>交通偏好<select name="transportation_preference"><option value="">不限定</option><option>高铁优先</option><option>飞机优先</option><option>总耗时优先</option><option>价格优先</option></select></label>
                <label>座席 / 舱位<input name="seat_preference" maxlength="40" placeholder="例如：高铁二等座、经济舱"></label>
                <label>住宿偏好<input name="hotel_preference" maxlength="60" placeholder="例如：安静、含早、近地铁"></label>
                <label>预算偏好<select name="budget_level"><option value="">不限定</option><option>经济</option><option>舒适</option><option>品质</option></select></label>
            </div>
            <div class="dialog-actions"><button type="button" class="secondary-btn" id="clear-local-data-btn">清除全部本机数据</button><button type="submit" class="primary-btn">保存偏好</button></div>
        </form>
    </dialog>

    <script src="/static/app.js"></script>
</body>
</html>
